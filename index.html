        function calculateFaceMove(e) {

                noseAngle = getAngle(noseCoords.x, noseCoords.y, emailCoords.x + emailScrollMax, emailCoords.y + 25);
                mouthAngle = getAngle(mouthCoords.x, mouthCoords.y, emailCoords.x + emailScrollMax, emailCoords.y + 25);

            eyeLX = Math.cos(eyeLAngle) * 20; eyeLY = Math.sin(eyeLAngle) * 10;
            eyeRX = Math.cos(eyeRAngle) * 20; eyeRY = Math.sin(eyeRAngle) * 10;

            mouthX = Math.cos(mouthAngle) * 23; mouthY = Math.sin(mouthAngle) * 10;

            const t = transactions.find(x => x.id === id); if(!t) return;
            activeCreditDeuda = t; const m = document.getElementById('credit-detail-modal'), c = document.getElementById('credit-detail-content'), btnPay = document.getElementById('btn-pay-installment');
            
            let html = `<div class="mb-5 flex items-center gap-3"><div class="w-12 h-12 rounded-xl bg-slate-50 dark:bg-slate-800 flex items-center justify-center shrink-0 border border-slate-200 dark:border-slate-700"><i class="ph-fill ph-credit-card text-[#4eb8dd] text-2xl"></i></div><div class="min-w-0"><h4 class="font-extrabold text-xl text-[#217093] dark:text-white truncate">${t.desc}</h4><p class="text-xs text-slate-400 font-medium">Corte: Día ${t.cutDay} • Límite: Día ${t.payDay}</p></div></div><div class="flex gap-3 mb-4 w-full min-w-0"><div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700 flex-1 min-w-0"><p class="text-[10px] uppercase font-bold text-slate-400 mb-1 truncate">Total Compra</p><p class="font-bold text-slate-900 dark:text-white truncate">${formatCOP(t.totalAmount)}</p></div><div class="bg-rose-50 dark:bg-rose-900/20 rounded-xl p-3 border border-rose-100 dark:border-rose-900/50 flex-1 min-w-0"><p class="text-[10px] uppercase font-bold text-rose-400 mb-1 truncate">Deuda Actual</p><p class="font-bold text-rose-500 truncate">${formatCOP(t.pendingAmount)}</p></div></div><div class="flex gap-3 mb-4 w-full min-w-0"><div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700 flex-1 min-w-0"><p class="text-[10px] uppercase font-bold text-slate-400 mb-1 truncate">Cuotas Pagadas</p><p class="font-bold text-slate-900 dark:text-white truncate">${t.paidInstallments} / ${t.totalInstallments}</p></div><div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-3 border border-slate-200 dark:border-slate-700 flex-1 min-w-0"><p class="text-[10px] uppercase font-bold text-slate-400 mb-1 truncate">Valor Cuota</p><p class="font-bold text-slate-900 dark:text-white truncate">${formatCOP(t.monthlyPayment)}</p></div></div>`;
            
            if (t.paidInstallments >= t.totalInstallments || t.pendingAmount <= 0) {
                html += `<div class="bg-emerald-50 dark:bg-emerald-900/30 p-3 rounded-xl text-center text-emerald-600 dark:text-emerald-400 font-bold text-sm border border-emerald-100 dark:border-emerald-800/50 truncate w-full"><i class="ph-bold ph-check-circle mr-1"></i> Deuda Cancelada</div>`;
                btnPay.classList.add('hidden');
            } else { 
                html += `<div class="space-y-2 mb-4 w-full animate-fade"><label class="text-xs font-bold text-[#217093] dark:text-[#4eb8dd] uppercase tracking-wider">Monto a abonar</label><div class="flex items-center bg-slate-50 dark:bg-slate-950 rounded-2xl px-4 py-1 border border-slate-200 dark:border-slate-700 focus-within:border-[#4eb8dd] focus-within:ring-2 focus-within:ring-[#4eb8dd]/20 transition-all shadow-sm"><span class="text-slate-400 font-bold text-lg mr-2">$</span><input type="number" id="custom-pay-amount" class="flex-1 bg-transparent text-xl font-bold text-[#217093] dark:text-white focus:outline-none py-3" value="${Math.min(t.monthlyPayment, t.pendingAmount)}" max="${t.pendingAmount}"></div></div>`;
                btnPay.innerText = 'Abonar a Deuda'; btnPay.classList.remove('hidden'); 
            }
            c.innerHTML = html; m.classList.remove('hidden'); m.classList.add('flex');
        }

        window.closeCreditDetailModal = () => { document.getElementById('credit-detail-modal').classList.add('hidden'); document.getElementById('credit-detail-modal').classList.remove('flex'); activeCreditDeuda = null; }

        window.payCreditInstallment = () => {
            const t = activeCreditDeuda; if (!t) return;
            const payInput = document.getElementById('custom-pay-amount');
            let amountToPay = t.monthlyPayment;
            if (payInput) amountToPay = parseFloat(payInput.value);

            if (isNaN(amountToPay) || amountToPay <= 0) { window.showCustomAlert('Monto Inválido', 'Ingresa un valor mayor a cero.', 'ph-warning-circle text-orange-500'); return; }
            if (amountToPay > t.pendingAmount) amountToPay = t.pendingAmount; 
            
            window.showConfirm('Abonar a Deuda', `Se abonará ${formatCOP(amountToPay)} a esta tarjeta.`, async () => {
                try {
                    await addDoc(collection(db, "transactions"), { userId: currentUser.uid, type: 'credit_payment', parentCreditId: t.id, amount: amountToPay, desc: `Abono: ${t.desc}`, date: new Date().toISOString().split('T')[0], createdAt: serverTimestamp() });
                    let instPaid = amountToPay >= t.monthlyPayment ? Math.floor(amountToPay / t.monthlyPayment) : 0;
                    if (instPaid === 0 && (t.pendingAmount - amountToPay) <= 0) instPaid = 1;
                    await updateDoc(doc(db, "transactions", t.id), { paidInstallments: t.paidInstallments + instPaid, pendingAmount: Math.max(0, t.pendingAmount - amountToPay) });
                    window.closeConfirm(); window.closeCreditDetailModal(); window.showCustomAlert('Abono Exitoso', 'El pago fue procesado.', 'ph-check-circle text-emerald-500');
                } catch(e) {}
            });
        }

        window.deleteCurrentCredit = () => {
            const t = activeCreditDeuda; if(!t) return;
            window.showConfirm('Eliminar Tarjeta', 'Se borrará la deuda del registro.', async () => { try { await deleteDoc(doc(db, "transactions", t.id)); window.closeConfirm(); window.closeCreditDetailModal(); } catch(e){} });
        }

        window.openTransactionModal = () => { document.getElementById('tx-modal').classList.remove('hidden'); document.getElementById('tx-modal').classList.add('flex'); window.setTxType('expense'); }
        window.closeTransactionModal = () => { document.getElementById('tx-modal').classList.add('hidden'); document.getElementById('tx-modal').classList.remove('flex'); }
        
        window.setTxType = (type) => {
            currentTxType = type; const be = document.getElementById('btn-type-expense'); const bi = document.getElementById('btn-type-income');
            if(type === 'expense') { be.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-800 text-rose-500 shadow-sm border border-slate-200 dark:border-slate-700 transition"; bi.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 dark:text-slate-400 transition"; } 
            else { bi.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-slate-800 text-emerald-500 shadow-sm border border-slate-200 dark:border-slate-700 transition"; be.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 dark:text-slate-400 transition"; }
        }

        window.saveTransaction = async () => {
            if(!currentUser) return;
            const amount = parseFloat(document.getElementById('tx-amount').value), desc = document.getElementById('tx-desc').value, accId = document.getElementById('tx-account').value;
            if(!amount || !desc) { window.showCustomAlert('Error', 'Revisa el monto y la descripción', 'ph-warning-circle text-orange-500'); return; }
            if(!accId && accounts.length > 0) { window.showCustomAlert('Error', 'Selecciona una cuenta', 'ph-warning-circle text-orange-500'); return; }
            try { await addDoc(collection(db, "transactions"), { userId: currentUser.uid, type: currentTxType, amount: amount, desc: desc, accountId: accId, date: new Date().toISOString().split('T')[0], createdAt: serverTimestamp() }); window.closeTransactionModal(); document.getElementById('tx-amount').value = ''; document.getElementById('tx-desc').value = ''; window.showCustomAlert('Éxito', 'Movimiento guardado', 'ph-check-circle text-emerald-500'); } catch(e) {}
        }

        function loadUserData() {
            if(!currentUser) return;
            unsubscribeTx = onSnapshot(query(collection(db, "transactions")), (snap) => { transactions = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(t => t.userId === currentUser.uid).sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0)); renderData(); });
            unsubscribeAcc = onSnapshot(query(collection(db, "accounts")), (snap) => { accounts = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(a => a.userId === currentUser.uid); renderData(); });
        }

        // ==========================================
        // AUTO-REGISTRO Y LOGIN INTELIGENTE
        // ==========================================
        window.handleAuth = async () => {
            const el = document.getElementById('auth-email').value.trim();
            const ps = document.getElementById('auth-password').value.trim();
            const err = document.getElementById('auth-error');
            const btn = document.getElementById('auth-btn');
            
            if(!el || !ps) { err.innerText = 'Rellena todos los campos'; err.classList.remove('hidden'); return; }
            
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>';
            err.classList.add('hidden');
            
            try {
                // 1. Intentamos iniciar sesión normal
                await signInWithEmailAndPassword(auth, el, ps);
            } catch(e) {
                // 2. Si el usuario no existe, ¡Lo creamos automáticamente!
                try {
                    await createUserWithEmailAndPassword(auth, el, ps);
                } catch(e2) {
                    btn.innerHTML = 'Entrar a la bóveda';
                    err.innerText = 'La contraseña debe tener mínimo 6 caracteres o los datos son inválidos.';
                    err.classList.remove('hidden');
                }
            }
        }

        window.logout = async () => { if(unsubscribeTx) unsubscribeTx(); if(unsubscribeAcc) unsubscribeAcc(); await signOut(auth); }

        onAuthStateChanged(auth, (user) => {
            const loginView = document.getElementById('login-view'), mainApp = document.getElementById('main-app');
            if (user) {
                currentUser = user;
                document.getElementById('user-initial').innerText = user.email.charAt(0).toUpperCase();
                document.getElementById('user-email-display').innerText = user.email;
                loginView.style.transform = 'translateY(-100%)';
                setTimeout(() => { loginView.classList.add('hidden'); mainApp.classList.remove('hidden'); mainApp.classList.add('flex'); window.switchTab('dashboard'); loadUserData(); }, 500);
            } else {
                currentUser = null; loginView.classList.remove('hidden');
                setTimeout(() => { loginView.style.transform = 'translateY(0)'; mainApp.classList.add('hidden'); mainApp.classList.remove('flex'); document.getElementById('auth-password').value = ''; }, 50);
            }
        });
    </script>
</body>
</html>
